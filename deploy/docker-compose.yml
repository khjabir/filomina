# Self-hosting with HTTPS in two containers: the app + Caddy (automatic Let's Encrypt).
# Tuned for a 4-core / 24 GB Oracle "Always Free" Ampere VM – see DEPLOY-ORACLE.md.
#   DOMAIN=photos.example.com docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      args:
        MODEL_PACK: l          # "sc" for the light model pack on tiny servers
    restart: unless-stopped
    env_file: ../.env.local
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - FACE_MODELS_DIR=/app/models
      - FACE_INDEX_CONCURRENCY=${FACE_INDEX_CONCURRENCY:-4}
      - FACE_THREADS=${FACE_THREADS:-1}
      - FACE_REQUEST_BUDGET_MS=${FACE_REQUEST_BUDGET_MS:-3600000}
    volumes:
      - filomina-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/index/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN=your.domain.tld}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  filomina-data:
  caddy-data:
  caddy-config:
